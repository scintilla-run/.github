name: Codespace edge contract

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'Justfile'
      - '.github/workflows/codespace-edge-contract.yml'
      - 'docs/CODESPACES_EDGE_HOSTING.md'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'Justfile'
      - '.github/workflows/codespace-edge-contract.yml'
      - 'docs/CODESPACES_EDGE_HOSTING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codespace-edge-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate Codespace edge contract
        shell: bash
        run: |
          set -euo pipefail
          cfg=.devcontainer/devcontainer.json
          test -s "$cfg"
          grep -Fq -- '--rev c854130ee147e9793a3af8736e90241630a5c934' "$cfg"
          grep -Fq 'ORES_CLI_READ_TOKEN' "$cfg"
          grep -Fq 'TUNNEL_TOKEN' "$cfg"
          grep -Fq 'CARGO_NET_GIT_FETCH_WITH_CLI=true' "$cfg"
          grep -Fq 'just codespace-edge-check' "$cfg"
          grep -Fq '"8080"' "$cfg"
          grep -Fq '"onAutoForward": "ignore"' "$cfg"
          grep -Fq 'codespace-edge-up:' Justfile
          grep -Fq 'codespace-edge-status:' Justfile
          grep -Fq 'codespace-edge-down:' Justfile
          grep -Fq 'codespace-edge-check:' Justfile
          ! grep -Eq 'https://x-access-token:|ghp_|github_pat_|CF_TUNNEL_TOKEN|\.app\.github\.dev' "$cfg"
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.lock'
