# Static ORES trace-marker compatibility contract.
# Compatibility/admission: ^ores-(trace|routine)-[A-Za-z0-9_-]{12,64}$
# Canonical generator width: 21-character nanoid suffix.
name: ORES static trace markers

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  static-ids:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out canonical checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-otel/ores.otel.log
          ref: 4bc592884286f47372b4488b96d105bf40ef2d11
          path: .ores-trace-contract-source
          sparse-checkout: .github/ores-trace-contract.rs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build canonical checker
        shell: bash
        run: rustc -O -o "$RUNNER_TEMP/ores-trace-contract" .ores-trace-contract-source/.github/ores-trace-contract.rs

      - name: Self-test canonical checker
        shell: bash
        run: |
          set -euo pipefail
          rustc --test -o "$RUNNER_TEMP/ores-trace-contract-test" .ores-trace-contract-source/.github/ores-trace-contract.rs
          "$RUNNER_TEMP/ores-trace-contract-test"

      - name: Enforce static ORES IDs
        shell: bash
        run: "$RUNNER_TEMP/ores-trace-contract" .
